spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Service Discovery (Eureka)
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8081/eureka}

# Roteamento Dinamico via Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Em producao, forneca via variavel de ambiente JWT_SECRET (minimo 256 bits)
jwt.secret=${JWT_SECRET:SUA_CHAVE_JWT_SECRETA_LOCAL_COM_NO_MINIMO_32_CARACTERES}

# Configuracao Global de CORS para o API Gateway
# Origem padrao local do Next.js (sobrescrita por FRONTEND_URL se necessario)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[0]=${FRONTEND_URL:http://localhost:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[1]=http://localhost:8080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[1]=Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders[0]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Agregacao do OpenAPI / Swagger UI dos microsservicos
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=1. User Services
springdoc.swagger-ui.urls[0].url=/identity-ms/v3/api-docs

springdoc.swagger-ui.urls[1].name=2. Booking Services
springdoc.swagger-ui.urls[1].url=/booking-ms/v3/api-docs